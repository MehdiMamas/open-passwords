[package]
name = "passbridge-desktop"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "PassBridge tray app that types an iCloud login into the focused Windows field"

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
getrandom = "0.2"
num-bigint = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
typenum = "1.17"
url = "2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
zeroize = "1"
