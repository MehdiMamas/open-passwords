name: Desktop release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Test
        run: cargo test --manifest-path desktop/Cargo.toml
      - name: Build
        run: cargo build --release --manifest-path desktop/Cargo.toml
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path desktop/target/release/passbridge-desktop.exe, desktop/README.md -DestinationPath passbridge-desktop-windows-x64.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        with:
          files: passbridge-desktop-windows-x64.zip
